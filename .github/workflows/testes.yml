name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint e formatação (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Suíte completa (inclui regressão) com cobertura
        run: pytest --cov

  # Mesmo banco da produção (Postgres, spec 015): usuário django_app e schema
  # django, como em deploy/supabase.sql. Pega diferenças entre SQLite e Postgres.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      # Sem isto o psql tenta abrir um banco com o nome do usuário (ex.: admin_supabase).
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ambiente como no Supabase (admin sem superusuário, storage.buckets)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role admin_supabase with login createrole password 'admin';
          grant create on database postgres to admin_supabase;
          create schema storage;
          create table storage.buckets (id text primary key, name text, public boolean);
          grant usage on schema storage to admin_supabase;
          grant select, insert on storage.buckets to admin_supabase;
          SQL
      - name: Roda deploy/supabase.sql de verdade (duas vezes, é idempotente)
        env:
          PGUSER: admin_supabase
          PGPASSWORD: admin
        run: |
          for vez in 1 2; do
            sed "s/TROQUE-POR-UMA-SENHA-FORTE/django_app/" deploy/supabase.sql | psql -v ON_ERROR_STOP=1
          done
          # Cada conferência vira anotação no GitHub (visível sem abrir os logs).
          confere() {
            local nome="$1" esperado="$2" sql="$3" obtido
            obtido="$(psql -tAc "$sql")"
            if [ "$obtido" = "$esperado" ]; then
              echo "::notice::$nome: ok ($obtido)"
            else
              echo "::error::$nome: esperado '$esperado', obtido '$obtido'"
              falhou=1
            fi
          }
          falhou=0
          confere "dono do schema django" "django_app" \
            "select pg_get_userbyid(nspowner) from pg_namespace where nspname = 'django'"
          confere "bucket anexos-django privado" "f" \
            "select public from storage.buckets where id = 'anexos-django'"
          # O Postgres 16+ mantém a participação só administrativa de quem criou o
          # role (necessária para gerenciá-lo); o que não pode sobrar é poder AGIR
          # como django_app (SET ROLE), concedido pelo script só durante a criação.
          confere "ninguém age como django_app" "0" \
            "select count(*) from pg_auth_members m join pg_roles r on r.oid = m.roleid where r.rolname = 'django_app' and m.set_option"
          confere "search_path do django_app" "search_path=django" \
            "select array_to_string(setconfig, ',') from pg_db_role_setting s join pg_roles r on r.oid = s.setrole where r.rolname = 'django_app'"
          exit $falhou
      - name: migrate no schema django
        env:
          DATABASE_URL: postgresql://django_app:django_app@localhost:5432/postgres
        run: |
          python manage.py migrate --noinput
          python manage.py check --database default
          test "$(psql -tAc "select count(*) from information_schema.tables where table_schema = 'django'")" -gt 10
          test "$(psql -tAc "select count(*) from information_schema.tables where table_schema = 'public'")" -eq 0
      - name: Check recusa conexão fora do schema django
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          if python manage.py check --database default; then
            echo "O check ocorrencias.E001 deveria ter barrado o schema public" && exit 1
          fi
      - name: Suíte completa no Postgres
        env:
          TESTES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q
