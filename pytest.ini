[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --strict-config -ra
markers =
    unit: lógica pura, sem banco nem HTTP (aplicado automaticamente à pasta tests/unit)
    regras: serviços, modelos e permissões com banco (tests/regras)
    http: telas e fluxos pelo cliente HTTP do Django (tests/http)
    regressao: protege um bug já corrigido ou uma regra crítica; nunca deve ser removido (tests/regressao)
filterwarnings =
    error::DeprecationWarning
    ignore:The EMAIL_BACKEND setting is deprecated:DeprecationWarning
