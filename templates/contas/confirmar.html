{% extends "partials/centralizado.html" %}
{% block title %}Confirmar acesso · Portal de Ocorrências{% endblock %}

{% block conteudo %}
<div class="text-center">
  <h1 class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-white">Confirmar acesso</h1>
  <p class="mt-1 text-sm text-zinc-500">Clique no botão abaixo para continuar.</p>

  <form method="post" class="mt-8">
    {% csrf_token %}
    <input type="hidden" name="uid" value="{{ uid }}">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
      class="flex h-11 w-full items-center justify-center rounded-lg bg-zinc-900 px-4 text-sm font-medium text-white transition-colors hover:bg-zinc-700 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-200">
      Continuar
    </button>
  </form>
</div>
{% endblock %}
