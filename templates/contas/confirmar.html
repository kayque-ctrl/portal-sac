{% extends "partials/centralizado.html" %}
{% block title %}Confirmar acesso · Portal de Ocorrências{% endblock %}

{% block conteudo %}
<div>
  <h1>Confirmar acesso</h1>
  <p class="mt-1 suave">Clique no botão abaixo para continuar.</p>
</div>

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="uid" value="{{ uid }}">
  <input type="hidden" name="token" value="{{ token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn btn-primario btn-grande btn-bloco">Continuar</button>
</form>
{% endblock %}
