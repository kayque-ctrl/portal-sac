{% load ocorrencias_tags %}
{% comment %}Parâmetros: id, name, label, autocomplete, minlength, hint, model (x-model opcional), extra_rotulo (link ao lado do rótulo){% endcomment %}
<div x-data="campoSenha" class="campo">
  <div class="linha-rot">
    <label for="{{ id }}">{{ label }}</label>
    {% if extra_rotulo %}<span class="ml-auto text-sm">{{ extra_rotulo|safe }}</span>{% endif %}
  </div>
  <div class="relative">
    <input id="{{ id }}" name="{{ name }}" :type="ver ? 'text' : 'password'" type="password" required class="in" style="padding-right: 52px"
      {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
      {% if minlength %}minlength="{{ minlength }}"{% endif %}
      {% if model %}x-model="{{ model }}"{% endif %}>
    <button type="button" @click="ver = !ver" :aria-label="ver ? 'Ocultar senha' : 'Mostrar senha'"
      class="absolute right-0.5 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center suave">
      <span x-show="!ver">{% icone "eye" 18 %}</span>
      <span x-show="ver" x-cloak>{% icone "eye-off" 18 %}</span>
    </button>
  </div>
  {% if hint %}<p class="ajuda">{{ hint }}</p>{% endif %}
</div>
