{% load ocorrencias_tags %}
{% comment %}Parâmetros: id, name, label, autocomplete, minlength, hint, model (x-model opcional){% endcomment %}
<div x-data="campoSenha">
  <label for="{{ id }}" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">{{ label }}</label>
  <div class="relative mt-1">
    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500">{% icone "lock" 16 %}</span>
    <input id="{{ id }}" name="{{ name }}" :type="ver ? 'text' : 'password'" type="password" required
      {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
      {% if minlength %}minlength="{{ minlength }}"{% endif %}
      {% if model %}x-model="{{ model }}"{% endif %}
      class="w-full rounded-lg border border-zinc-300 bg-white py-2 pl-9 pr-10 text-zinc-900 outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 dark:border-zinc-700 dark:bg-zinc-900 dark:text-white dark:focus:border-zinc-400">
    <button type="button" @click="ver = !ver" :aria-label="ver ? 'Ocultar senha' : 'Mostrar senha'"
      class="absolute right-1.5 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-200">
      <span x-show="!ver">{% icone "eye" 16 %}</span>
      <span x-show="ver" x-cloak>{% icone "eye-off" 16 %}</span>
    </button>
  </div>
  {% if hint %}<p class="mt-1 text-xs text-zinc-500">{{ hint }}</p>{% endif %}
</div>
