{% comment %}
Modal de confirmação para usar DENTRO de um <form x-data="confirmar" @submit="interceptar">.
Parâmetros: titulo, mensagem, rotulo (padrão "Confirmar"), perigo (bool).
{% endcomment %}
<template x-teleport="body">
  <div x-show="aberto" x-cloak @keydown.escape.window="if (!enviando) aberto = false"
    class="fixed inset-0 z-[60] flex items-end justify-center bg-black/40 p-4 animate-fadein sm:items-center"
    @click.self="if (!enviando) aberto = false">
    <div class="card w-full max-w-md shadow-xl" role="dialog" aria-modal="true">
      <h3 class="text-lg font-bold">{{ titulo }}</h3>
      <p class="mt-2 text-[15px] suave">{{ mensagem|safe }}</p>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" @click="aberto = false" :disabled="enviando" class="btn btn-linha">Cancelar</button>
        <button type="button" @click="confirmar()" :disabled="enviando" class="btn {% if perigo %}btn-perigo-cheio{% else %}btn-primario{% endif %}">
          <span x-text="enviando ? 'Aguarde…' : '{{ rotulo|default:'Confirmar'|escapejs }}'"></span>
        </button>
      </div>
    </div>
  </div>
</template>
