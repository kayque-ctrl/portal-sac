{% load ocorrencias_tags %}
{% comment %}
Sino de notificações (abre as recentes; "Ver todas" leva à página).
Parâmetro: lado ("direita" abre para baixo e à direita do botão; "lateral" abre ao lado do menu).
{% endcomment %}
<div x-data="sino({{ notif_nao_lidas|default:0 }})" class="relative" @click.outside="aberto = false" @keydown.escape="aberto = false">
  <button type="button" @click="alternar()" class="ico" :aria-expanded="aberto" aria-haspopup="true" aria-label="Notificações" data-sino {% if lado == "lateral" %}style="width: 36px; height: 36px"{% endif %}>
    {% icone "bell" 18 %}
    <span x-show="naoLidas > 0" x-cloak class="ponto-s" x-text="naoLidas > 9 ? '9+' : naoLidas"></span>
  </button>
  <div x-show="aberto" x-cloak class="pop animate-fadein w-[22rem] {% if lado == 'lateral' %}left-0 top-11{% else %}right-0 top-12{% endif %}">
    <div class="flex items-center justify-between gap-2 border-b px-4 py-3" style="border-color: var(--linha)">
      <span class="text-sm font-bold">Notificações</span>
      <button type="button" x-show="temNaoLidas" x-cloak @click="marcarTodas()" data-marcar-todas class="link text-xs">Marcar todas como lidas</button>
    </div>
    <p x-show="carregado && itens.length === 0" class="px-4 py-6 text-center text-sm suave">Nenhuma notificação.</p>
    <p x-show="!carregado" class="px-4 py-6 text-center text-sm suave">Carregando…</p>
    <ul x-show="itens.length > 0" class="max-h-96 overflow-y-auto">
      <template x-for="n in itens" :key="n.id">
        <li class="border-b last:border-0" style="border-color: var(--linha)">
          <a :href="n.href || '#'" class="flex items-start gap-3 px-4 py-3 hover:bg-[var(--sup-3)]" @click="if (!n.href) $event.preventDefault(); aberto = false">
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[2px]" style="background: var(--sup-2)" :class="n.cor"><i :data-lucide="n.icone" style="width:15px;height:15px"></i></span>
            <span class="min-w-0 flex-1">
              <span class="block text-sm" :class="n.lida ? 'suave' : 'font-bold'" x-text="n.mensagem"></span>
              <span class="mt-0.5 block text-xs fraco" x-text="n.quando"></span>
            </span>
            <span x-show="!n.lida" class="mt-1.5 h-2 w-2 shrink-0 rounded-full" style="background: var(--preto)"></span>
          </a>
        </li>
      </template>
    </ul>
    <a href="{{ area_base }}/notificacoes" @click="aberto = false" class="block border-t px-4 py-3 text-center text-sm font-bold hover:bg-[var(--sup-3)]" style="border-color: var(--linha)">Ver todas</a>
  </div>
</div>
