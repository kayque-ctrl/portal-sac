{% comment %}Parâmetros: label, valor, destaque (bool), sub, tom (neutro|bom|ruim|alerta){% endcomment %}
<div class="rounded-xl border p-4 {% if destaque %}border-blue-200 bg-blue-50 dark:border-blue-900/50 dark:bg-blue-950/30{% else %}border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900{% endif %}">
  <p class="text-xs font-medium uppercase tracking-wide text-zinc-500">{{ label }}</p>
  <p class="mt-2 text-3xl font-semibold tabular-nums {% if destaque %}text-blue-700 dark:text-blue-300{% else %}text-zinc-900 dark:text-white{% endif %}">{{ valor }}</p>
  {% if sub %}
  <p class="mt-1 text-xs {% if tom == 'bom' %}text-green-600 dark:text-green-400{% elif tom == 'ruim' %}text-red-600 dark:text-red-400{% elif tom == 'alerta' %}text-amber-600 dark:text-amber-400{% else %}text-zinc-500{% endif %}">{{ sub }}</p>
  {% endif %}
</div>
