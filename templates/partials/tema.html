{% load ocorrencias_tags %}
<button type="button" x-data="tema" @click="alternar()" aria-label="Alternar tema claro/escuro" title="Alternar tema"
  class="flex h-9 w-9 items-center justify-center rounded-lg border border-zinc-200 text-zinc-600 transition-colors hover:bg-zinc-100 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800 {{ classe }}">
  <span x-show="escuro" x-cloak>{% icone "sun" 18 %}</span>
  <span x-show="!escuro" x-cloak>{% icone "moon" 18 %}</span>
</button>
